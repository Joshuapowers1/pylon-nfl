name: weekly in-season update

# The whole point of the in-season engine: once games start, a rating frozen at
# week zero is the worst version of this model. This refits it every Tuesday
# morning on whatever has been played, rebuilds the site, and commits the result.
on:
  schedule:
    - cron: "0 13 * * 2"     # Tuesdays 13:00 UTC, after Monday night resolves
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Play-by-play for completed seasons never changes, so re-downloading
      # 183MB every Tuesday for a few megabytes of new plays is waste.
      - name: Cache historical play-by-play
        uses: actions/cache@v4
        with:
          path: data/raw
          key: pbp-${{ hashFiles('scripts/fetch_data.sh') }}-v1
          restore-keys: pbp-

      - name: Fetch source data
        run: ./scripts/fetch_data.sh

      # Rosters move all season, so the id table the roster import resolves
      # against has to move with them or an added player reads as unmatched.
      - name: Refresh the Sleeper id table
        run: python scripts/refresh_sleeper.py

      - name: Refit and rebuild
        run: |
          PYTHONPATH=src python -m pylon.run --sims 25000 --player-sims 10000
          PYTHONPATH=src python -m pylon.webdata
          cd web && ./build.sh

      - name: Run the test suite against the new outputs
        run: python -m pytest

      - name: Commit if anything changed
        run: |
          git config user.name  "Joshua Powers"
          git config user.email "joshpowersbiz@gmail.com"
          git add out/ config/ docs/ web/index.html
          if git diff --staged --quiet; then
            echo "no change this week"
          else
            git commit -m "Weekly refit: $(date -u +%Y-%m-%d)"
            git push
          fi

      # The likeliest failure mode for this project is not a bug, it is a data
      # source quietly changing shape in week six and the site sitting frozen
      # while nobody notices. Fail loudly.
      - name: Open an issue if the refit failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Weekly refit failed: ${new Date().toISOString().slice(0,10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'refit-failure'
            });
            const body = [
              'The Tuesday in-season refit did not complete, so the published site is now stale.',
              '',
              `Run: ${run}`,
              '',
              'Most likely causes, in order:',
              '- a data source changed shape (nflverse release name, FantasyFootballCalculator schema, ESPN logo path)',
              '- the schedule file has not published the current week yet',
              '- a test started failing against the new outputs'
            ].join('\n');
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['refit-failure']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Failed again on ${new Date().toISOString().slice(0,10)}. ${run}`
              });
            }
